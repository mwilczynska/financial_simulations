name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,parquet]'
      # The app's tests are skipped here (its packages are not installed), so compile every file for syntax.
      - run: python -m compileall -q src scripts tests
      - run: python -m pytest
      - run: python scripts/check_repository.py
