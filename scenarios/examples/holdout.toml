# Stage 1D rolling calibration/holdout: each origin fits only on earlier returns.
[study]
name = "Rolling ten-year calibration with one- and five-year holdouts"
initial_value = 100000.0
currency = "USD"
reference = "Optimised CURRENT 40/20/20/20"

[data]
root = "../../../financial_datasets/data/processed"
format = "csv"
calendar_policy = "common_dates"

[[portfolios]]
name = "Optimised CURRENT 40/20/20/20"
rebalance = "annual"
weights = {USLCAP3x = 0.4, ITT3x = 0.2, GOLDPM2x = 0.2, COMM = 0.2}

[[portfolios]]
name = "Unlevered same mix"
rebalance = "annual"
weights = {USLCAP = 0.4, ITT = 0.2, GOLDPM = 0.2, COMM = 0.2}

[[portfolios]]
name = "Equal-weight global four-asset"
rebalance = "annual"
weights = {GLSTOCK = 0.25, GLBOND = 0.25, GOLDPM = 0.25, COMM = 0.25}

[generators]
methods = ["stationary", "lognormal", "garch_fhs"]
block_length = 63
paths = 256
seeds = [1729]
batch_size = 128
observations_per_year = 252
# A holdout forecast starts from the volatility filtered up to its origin.
initial_variance = "last_fitted"
persistence_cap = 0.999

[holdout]
horizons = [252, 1260]
data_start = "1970-01-01"
data_end = "2025-12-31"
calibration_years = 10
mode = "rolling"
first_origin_year = 1980
step_years = 1
