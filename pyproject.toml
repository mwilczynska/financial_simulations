[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial_simulations"
version = "0.1.0"
description = "Daily portfolio simulation and Australian retirement research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
parquet = ["pyarrow>=16"]
ui = ["streamlit>=1.60,<2"]

[project.scripts]
financial-simulations = "financial_simulations.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"financial_simulations.rules.au" = ["*.toml"]
"financial_simulations.retirement" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
