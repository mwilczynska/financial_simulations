# ---------------------------------------------------------------- access and retirement phase

[parameters.preservation_age]
value = [["1960-07-01", 55], ["1961-07-01", 56], ["1962-07-01", 57], ["1963-07-01", 58], ["1964-07-01", 59], ["9999-12-31", 60]]
units = "[born before date, preservation age]; the final row covers births from 1 July 1964"
status = "enacted"
source = "ato-payments-from-super"

[parameters.unrestricted_access_age]
value = 65
status = "enacted"
source = "ato-withdrawal-options"

[parameters.minimum_drawdown]
value = [[65, 0.04], [75, 0.05], [80, 0.06], [85, 0.07], [90, 0.09], [95, 0.11], [999, 0.14]]
units = "[age below, factor]; age at 1 July or at commencement"
status = "enacted"
source = "ato-payments-from-super"
note = "ATO describes the factors as indicative and points to SIS Regulations Schedule 7 for pro-rating and rounding."

[parameters.transfer_balance_cap]
value = 2100000
status = "published_indexed"
source = "ato-tbc"

[parameters.fund_earnings_tax_rate]
value = 0.15
status = "enacted"
source = "ato-ecpi"
note = "Complying fund accumulation-phase income; retirement-phase earnings are exempt current pension income."

[parameters.division_296]
value = { large_balance = 3000000, very_large_balance = 10000000, rate = 0.15, additional_rate = 0.10 }
status = "enacted"
source = "ato-div296-thresholds"
note = "From 1 July 2026 (Act No. 8, 2026). 15% on total super earnings x the percentage of the TSB reference amount over the large threshold, plus 10% x the percentage over the very large threshold (each rounded to 2 decimal places); nil if earnings are not above nil. The reference amount is the greater of the TSB just before the year and at its end, except in 2026-27 (end only). Implemented by superannuation.division_296_tax; see ato-div296-calculation."

[parameters.age_pension_age]
value = 67
status = "enacted"
source = "services-australia-age-pension"
note = "Age Pension and SAPTO eligibility start from Age Pension age. Residence of 10 years (5 continuous) is assumed met."

# ---------------------------------------------------------------- Age Pension (single, normal rates)
# Rates and thresholds below are those in force from 20 September 2026 (deeming thresholds and the assets
# full-pension limits from 1 July 2026). The rule set holds one value for the whole financial year, so
# 1 July to 19 September 2026 uses the September values: an approximation of under 3% for that period.

[parameters.age_pension_rate]
value = { basic = 1135.40, supplement = 88.20, supplement_taxable = 30.70, energy = 14.10 }
units = "AUD a fortnight; single"
status = "published_indexed"
source = "services-australia-age-pension-rates"
note = "Maximum basic rate $1,135.40 from 20 September 2026 (dss-guide-basic-rates: $29,520.40 a year). Pension supplement $88.20: the basic part ($30.70) is taxable, the minimum and remaining parts ($57.50) are not (dva-rates-2026-09-20, services-australia-pension-supplement). Energy supplement $14.10 is tax-free."

[parameters.age_pension_assets_test]
value = { homeowner = 333000, non_homeowner = 600000, taper_per_1000 = 3.0 }
units = "AUD of assessable assets; taper in AUD a fortnight per $1,000 over"
status = "published_indexed"
source = "services-australia-assets-test"
note = "Single full-pension limits. The $3 a fortnight per $1,000 taper reproduces the published part-pension cut-offs ($745,750 homeowner, $1,012,750 non-homeowner from 20 September 2026). The principal home is exempt."

[parameters.age_pension_income_test]
value = { free_area = 226, taper = 0.50, work_bonus_credit = 300, work_bonus_cap = 11800 }
units = "AUD a fortnight (Work Bonus cap is a balance)"
status = "published_indexed"
source = "services-australia-income-test"
note = "Single free area $226 a fortnight and 50c reduction per dollar over; cut-off $2,701.40 (= free area + 2 x maximum rate). Work Bonus: $300 credit a fortnight up to an $11,800 balance, offsetting employment income (services-australia-work-bonus)."

[parameters.deeming]
value = { threshold = 66800, lower_rate = 0.0175, upper_rate = 0.0375 }
units = "AUD of financial assets; annual rates"
status = "published_indexed"
source = "dss-guide-deeming"
note = "Single pensioner: 1.75% on the first $66,800 and 3.75% above, from 20 September 2026. Financial assets include cash, listed investments, account-based pensions and, from Age Pension age, superannuation in accumulation."
