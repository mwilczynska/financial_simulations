# ---------------------------------------------------------------- personal income tax

[parameters.resident_tax_thresholds]
value = [18200, 45000, 135000, 190000]
units = "AUD taxable income; each rate applies above its threshold"
status = "enacted"
source = "ato-resident-rates"

[parameters.resident_tax_rates]
value = [0.15, 0.30, 0.37, 0.45]
status = "enacted"
source = "act-2025-28"
note = "First marginal rate 15% for 2026-27 under Act No. 28, 2025; ATO table agrees."

[parameters.medicare_levy_rate]
value = 0.02
status = "enacted"
source = "ato-resident-rates"

[parameters.medicare_low_income_lower]
value = 28011
status = "assumption"
source = "ato-medicare-low-income"
note = "2025-26 single threshold, the latest published. 2026-27 thresholds are usually legislated late in the income year."

[parameters.medicare_low_income_upper]
value = 35013
status = "assumption"
source = "ato-medicare-low-income"
note = "2025-26 single upper threshold; see medicare_low_income_lower."

[parameters.medicare_low_income_shade_rate]
value = 0.10
status = "enacted"
source = "ato-medicare-low-income"
note = "Levy above the lower threshold is 10% of the excess until it reaches 2% of taxable income; reproduces the ATO's worked example ($29,000 -> $98.90)."

[parameters.mls_single_thresholds]
value = [105000, 123000, 164000]
units = "AUD income for MLS purposes; tier rate applies above each threshold"
status = "published_indexed"
source = "ato-mls"

[parameters.mls_rates]
value = [0.01, 0.0125, 0.015]
status = "enacted"
source = "ato-mls"

[parameters.lito]
value = { maximum = 700, first_threshold = 37500, first_taper = 0.05, second_threshold = 45000, second_base = 325, second_taper = 0.015, cut_out = 66667 }
status = "enacted"
source = "ato-lito"

[parameters.standard_deduction_maximum]
value = 1000
status = "enacted"
source = "ato-standard-deduction"
note = "Up to $1,000 for resident individuals with assessable labour income, limited to that income and reduced dollar for dollar by claimed work-related expenses (Act No. 49, 2026, Schedule 4)."

# ---------------------------------------------------------------- capital gains

[parameters.cgt_discount_individual]
value = 0.5
status = "enacted"
source = "ato-cgt-discount"
note = "Resident individual; asset owned at least 12 months, excluding the acquisition and CGT event days."

[parameters.cgt_discount_complying_fund]
value = 0.333333333333333333
status = "enacted"
source = "ato-ecpi"
note = "One-third discount for a complying super fund; unchanged by the 2026 CGT reform."

[parameters.cgt_reform_start]
value = "2027-07-01"
status = "enacted"
source = "ato-cgt-reform"
note = "Indexation, a 30% minimum tax and a 1 July 2027 valuation split apply to individuals from this date. Not implemented: CGT events on or after it are rejected."

# ---------------------------------------------------------------- super contributions

[parameters.concessional_cap]
value = 32500
status = "published_indexed"
source = "ato-contributions-caps"

[parameters.non_concessional_cap]
value = 130000
status = "published_indexed"
source = "ato-ncc-cap"

[parameters.bring_forward]
value = { age_limit = 75, three_year_below = 1840000, two_year_below = 1970000 }
units = "TSB at the prior 30 June; age is under 75 at any time in the year"
status = "published_indexed"
source = "ato-ncc-cap"

[parameters.carry_forward]
value = { tsb_below = 500000, years = 5 }
status = "enacted"
source = "ato-contributions-caps"

[parameters.contributions_tax_rate]
value = 0.15
status = "enacted"
source = "ato-contribution-types"

[parameters.division_293]
value = { threshold = 250000, rate = 0.15 }
status = "enacted"
source = "ato-div293"

[parameters.super_guarantee_rate]
value = 0.12
status = "enacted"
source = "ato-super-guarantee"

[parameters.maximum_contribution_base]
value = 270830
units = "AUD qualifying earnings per financial year"
status = "published_indexed"
source = "ato-super-guarantee"

[parameters.payday_super_business_days]
value = 7
status = "enacted"
source = "ato-payday-super"
note = "Employer deadline after each payday from 1 July 2026; the fund-received date is what counts towards caps."

# ---------------------------------------------------------------- access and retirement phase

[parameters.preservation_age]
value = [["1960-07-01", 55], ["1961-07-01", 56], ["1962-07-01", 57], ["1963-07-01", 58], ["1964-07-01", 59], ["9999-12-31", 60]]
units = "[born before date, preservation age]; the final row covers births from 1 July 1964"
status = "enacted"
source = "ato-payments-from-super"

[parameters.unrestricted_access_age]
value = 65
status = "enacted"
source = "ato-withdrawal-options"

[parameters.minimum_drawdown]
value = [[65, 0.04], [75, 0.05], [80, 0.06], [85, 0.07], [90, 0.09], [95, 0.11], [999, 0.14]]
units = "[age below, factor]; age at 1 July or at commencement"
status = "enacted"
source = "ato-payments-from-super"
note = "ATO describes the factors as indicative and points to SIS Regulations Schedule 7 for pro-rating and rounding."

[parameters.transfer_balance_cap]
value = 2100000
status = "published_indexed"
source = "ato-tbc"

[parameters.fund_earnings_tax_rate]
value = 0.15
status = "enacted"
source = "ato-ecpi"
note = "Complying fund accumulation-phase income; retirement-phase earnings are exempt current pension income."

[parameters.division_296]
value = { large_balance = 3000000, very_large_balance = 10000000, rate = 0.15, additional_rate = 0.10 }
status = "enacted"
source = "ato-div296-thresholds"
note = "From 1 July 2026 (Act No. 8, 2026). 2026-27 liability depends only on TSB at 30 June 2027. Not implemented: scenarios above the large balance threshold are rejected."
