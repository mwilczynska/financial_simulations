# Invented example plan; replace all personal amounts and dates before relying on it.
schema_version = 2
assets = ["USLCAP3x", "ITT3x", "GOLDPM2x", "COMM", "GLSTOCK"]

[plan]
name = "Example early retirement"
start_date = "2026-07-01"
years = 10

[person]
date_of_birth = "1972-09-15"
retirement_age = 55
private_hospital_cover = true
# Age Pension assets test: the home is exempt. other_assets: cars, contents and other assessable assets (AUD).
homeowner = true
other_assets = 0.0

[employment]
annual_salary = 160000.0
salary_sacrifice_per_year = 10400.0
# Salary (and salary sacrifice) rise each 1 July by the wage-growth assumption.
salary_indexed = true

[outside]
cash = 15000.0
cash_buffer = 10000.0
# Assumed nominal interest on cash (annual, taxable).
cash_interest = 0.03
investment_balance = 450000.0
opening_cost_base = 330000.0
opening_acquired = "2015-03-02"
weights = {USLCAP3x = 0.4, ITT3x = 0.2, GOLDPM2x = 0.2, COMM = 0.2}
rebalance = "annual"
# "surplus" invests all pay left after tax and spending; "fixed" invests contribution_per_year. Both stop at
# retirement; from then on all cash above cash_buffer (such as unspent pension payments) is reinvested.
saving = "surplus"
contribution_per_year = 0.0
# true raises the fixed contribution each 1 July by assumptions.cpi_annual.
contribution_indexed = true

[super]
balance = 650000.0
weights = {GLSTOCK = 1.0}
rebalance = "annual"
total_super_balance_prior_30_june = 650000.0
# Share of the super fund's accumulated (unrealised) gains it realises each year: a turnover assumption. Realised
# gains are taxed in accumulation and count towards Division 296. 0 realises nothing (a lower bound).
realised_gains = 0.2

[spending]
# Spending in today's dollars. It rises with CPI each 1 July, plus real_change (0 keeps buying power constant).
annual = 75000.0
real_change = 0.0
# Retirement spending starts "same" as above, at a different "amount" (retirement_annual, today's dollars), or at a
# "percent" of total wealth on the retirement date (retirement_percent).
retirement = "same"
retirement_percent = 0.04
# How retirement spending responds to markets: "fixed" (the default) keeps the amount whatever markets do;
# "guyton_klinger", "vanguard" and "percent" adjust it each 1 July and need retirement = "percent".
# minimum and maximum (today's dollars, 0 = none) bound the rules.
rule = "fixed"
minimum = 0.0
maximum = 0.0

[pension]
start_age = 60
transfer_all = true

[assumptions]
cpi_annual = 0.025
wage_growth_annual = 0.035
# Sustainable withdrawal rates cover retirement up to this age (portfolio only; no tax ledger).
planning_age = 95

[market]
paths = 1000
retirement_paths = 100
seed = 20261028
block_length = 63
